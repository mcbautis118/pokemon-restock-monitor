name: Restockd Live Inspect

on:
  workflow_dispatch:

jobs:
  inspect-restockd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect live Restockd public sightings
        run: node scripts/inspect-restockd-live.js
